# D1 variant: KL (logit) objective. Needs classifier logits on both sides;
# the teacher checkpoint from d1_cub200_teacher.yaml includes its classifier.
run:
  tag: d1_kl

backbone_policy: supported
teacher: {backbone: resnet50, weights: runs/teacher/best.pth, embed_dim: 512}
student: {backbone: resnet18, pretrained: true, embed_dim: 512}

head:
  pooling: gem
  normalize: true
  losses: {sce: 1.0, triplet: 1.0}
  triplet: {margin: 0.2, mining: batch_hard}

distill:
  objective: kl
  alpha: 1.0            # KL scale differs from embedding-space objectives
  kl: {temperature: 4.0}

data:
  adapter: cub200
  root: data
  input_size: 224
  sampler: pk
  p_classes: 16
  k_samples: 4
  num_workers: 8

train:
  epochs: 60
  optimizer: adamw
  lr: 3.0e-4
  weight_decay: 1.0e-4
  scheduler: cosine
  warmup_epochs: 2
  amp: true
  seed: 42
  eval_every: 5

eval: {batch_size: 256, report_retention: true}
